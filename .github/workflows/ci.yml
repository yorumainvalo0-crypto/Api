name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
      - name: Smoke test packaged app
        shell: bash
        run: node scripts/smoke.mjs --packaged release/*/win-unpacked/ai-workbench.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ai-workbench-windows
          path: release/*/*.exe
          if-no-files-found: error

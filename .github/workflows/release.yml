name: Release

# Builds the Windows installer and publishes it as a GitHub Release (tag v<version>) whenever
# main carries a package.json version that has no release yet – or on a pushed v* tag or a
# manual run. The installed app updates itself from these releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Is this version already released?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Publish when the release is missing or incomplete: the updater needs latest.yml plus the
          # installer and blockmap it names, and stray files point to a broken earlier upload.
          assets=$(gh release view "v$version" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | sort || true)
          expected=$(printf '%s\n' "AI-Workbench-Setup-$version.exe" "AI-Workbench-Setup-$version.exe.blockmap" latest.yml | sort)
          if [ "$assets" = "$expected" ]; then
            echo "v$version is already released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release assets: ${assets:-none} – publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
      # Upload with gh instead of electron-builder's publisher, which can race with itself
      # when creating the release and then skips latest.yml.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ needs.check.outputs.version }}'
          dir="release/$version"
          ls -la "$dir"
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" --target "$GITHUB_SHA" \
              --title "AI Workbench $version" --generate-notes
          fi
          installer="AI-Workbench-Setup-$version.exe"
          gh release upload "v$version" --clobber \
            "$dir/$installer" "$dir/$installer.blockmap" "$dir/latest.yml"
          # Remove leftovers from earlier uploads (e.g. names with dots instead of spaces).
          gh release view "v$version" --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              "$installer" | "$installer.blockmap" | latest.yml) ;;
              *) gh release delete-asset "v$version" "$name" --yes ;;
            esac
          done
          gh release view "v$version" --json assets -q '.assets[].name'

# Stands in for the server's own nginx: TLS for the public name, everything forwarded to
# portal-nginx (portal/deploy/nginx/portal.conf.template), exactly like 127.0.0.1:45012 in production
server {
    listen 8443 ssl;
    # Resolve the upstream per request so start order does not matter
    resolver 127.0.0.11 valid=10s;
    set $portal portal-nginx:80;
    server_name portal.test;

    ssl_certificate     /certs/portal.test.pem;
    ssl_certificate_key /certs/portal.test.key;

    client_max_body_size 60M;

    location / {
        proxy_pass http://$portal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}

# Local test stack mirroring production: nginx (TLS) → LibreChat + portal gateway, MongoDB,
# and test doubles for the Anthropic API. Usage: ./up.sh
name: portal-test

services:
  mongodb:
    image: mirror.gcr.io/library/mongo:8.0.20
    command: mongod --noauth
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongo:/data/db

  mocks:
    image: mirror.gcr.io/library/node:22-alpine
    working_dir: /mocks
    command: node server.mjs
    volumes:
      - ./mocks:/mocks:ro
    ports:
      - "127.0.0.1:8089:8080"

  portal-gateway:
    image: portal-gateway:dev
    depends_on: [mongodb]
    env_file: gateway.env
    ports:
      - "127.0.0.1:3090:8080"

  code-runner:
    image: portal-code-runner:dev
    environment:
      - WORK_DIR=${CODE_WORK_DIR:?run ./up.sh}
      - SANDBOX_IMAGE=portal-sandbox:dev
      - EXEC_TIMEOUT_SECONDS=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: sandbox containers bind-mount sub-directories of it
      - ${CODE_WORK_DIR:?run ./up.sh}:${CODE_WORK_DIR:?run ./up.sh}
      - ./data/code-store:/data/store

  api:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    depends_on: [mongodb, mocks, portal-gateway, nginx, code-runner]
    env_file: test.env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      # Trust the test certificate of portal.test
      - NODE_EXTRA_CA_CERTS=/certs/ca.pem
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - type: bind
        source: ./test.env
        target: /app/.env
      - type: bind
        source: ../deploy/librechat.yaml
        target: /app/librechat.yaml
      - ../deploy/skill:/app/skill:ro
      - ./data/uploads:/app/uploads
      - ./data/images:/app/client/public/images
      - ./data/logs:/app/logs
      - ./data/certs:/certs:ro

  nginx:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certs:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      default:
        # The public host name, reachable from LibreChat like from a browser
        aliases: [portal.test]

# Reference for the SERVER's nginx (/etc/nginx/sites-available/…): the old portal already forwards
# ai.dev.a-b-cloud.de to 127.0.0.1:45012 and the new portal listens there too (portal-nginx), so
# normally nothing changes. Compare the existing site with this file and only adjust what differs:
# X-Forwarded-For must be set (client IP for rate limits), uploads need client_max_body_size,
# streamed answers need proxy_buffering off and long timeouts.

server {
    listen 80;
    listen [::]:80;
    server_name ai.dev.a-b-cloud.de;
    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25.1: use "listen 443 ssl;" plus "http2 on;" instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.dev.a-b-cloud.de;

    # Keep the certificate paths of the existing site
    ssl_certificate     /etc/letsencrypt/live/ai.dev.a-b-cloud.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.dev.a-b-cloud.de/privkey.pem;

    # Must cover fileConfig.serverFileSizeLimit
    client_max_body_size 60M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:45012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streamed responses (SSE): no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

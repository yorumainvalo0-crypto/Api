# Copy into the LibreChat checkout (/opt/LibreChat) next to docker-compose.yml.
# Requires Docker Compose v2.24+ (for the !override/!reset tags).
# Like the old portal, only portal-nginx is published: 127.0.0.1:PORTAL_HTTP_PORT (45012), where the
# server's nginx (TLS on 443) already forwards ai.dev.a-b-cloud.de to.
# Images portal-gateway, portal-code-runner and portal-sandbox are built from this repository
# with portal/deploy/scripts/build-images.sh.

services:
  api:
    # Pinned to the version tested in portal/test-stack; update only after re-running the tests
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    # Reached only through portal-nginx
    ports: !reset []
    depends_on:
      - mongodb
      - portal-gateway
      - code-runner
    networks: [default, code]
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      # ./skill (document skills) is already mounted by LibreChat's docker-compose.yml

  admin-panel:
    # Not public: reach it through an SSH tunnel (ssh -L 3000:127.0.0.1:3000 <server>)
    ports: !override
      - "127.0.0.1:3000:3000"

  # Login (OIDC), invites, budgets, usage dashboard and MCP tools
  portal-gateway:
    image: portal-gateway:latest
    restart: always
    env_file: ./portal-gateway.env
    depends_on:
      - mongodb
    networks: [default, code]
    volumes:
      # Generated images, audio and videos (uid 1000 must be able to write)
      - /opt/portal-data/media:/data/media

  # Entry point: splits the traffic from the server's nginx between LibreChat and the gateway.
  # Docker publishes ports past ufw, so bind to localhost only.
  portal-nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
      - portal-gateway
    environment:
      - PUBLIC_HOST=${PORTAL_DOMAIN:-ai.dev.a-b-cloud.de}
    volumes:
      - ./portal-nginx/portal.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-45012}:80"

  # Code execution and file output (LibreChat Code API). Starts one network-less sandbox
  # container per execution through the Docker socket; never publish its port.
  code-runner:
    image: portal-code-runner:latest
    restart: always
    environment:
      - WORK_DIR=/opt/portal-data/code-work
      - SANDBOX_IMAGE=portal-sandbox:latest
      - CAD_SANDBOX_IMAGE=portal-cad-sandbox:latest
      - EXEC_TIMEOUT_SECONDS=120
      - EXEC_MEMORY=1g
      - MAX_PARALLEL=4
      - RETENTION_DAYS=7
    # Only LibreChat and the gateway can reach it (it holds the Docker socket)
    networks: [code]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: sandbox containers bind-mount sub-directories of it
      - /opt/portal-data/code-work:/opt/portal-data/code-work
      - /opt/portal-data/code-store:/data/store

networks:
  code:
    internal: true

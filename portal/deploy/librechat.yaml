# LibreChat config for ai.dev.a-b-cloud.de
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17
cache: true

interface:
  customWelcome: "Willkommen im A-B Cloud AI Portal"
  modelSelect: true
  parameters: true
  # Show balance and per-chat cost in USD
  currency:
    code: "USD"
    rate: 1
  contextUsage: true
  contextCost: true
  # Enable once a RAG embeddings provider is configured
  fileSearch: false
  termsOfService:
    modalAcceptance: true
    modalTitle: "Nutzungsbedingungen"
    modalContent: |
      Dieses Portal nutzt die Anthropic API (Chat) und OpenRouter (Bild, Sprache, Video). Deine Eingaben und hochgeladenen Dateien werden zur Verarbeitung an diese Anbieter übertragen.

      - Es gilt die Usage Policy von Anthropic: https://www.anthropic.com/legal/aup
      - Keine vertraulichen Kundendaten oder Passwörter eingeben.
      - Jeder Account hat ein Budget in US-Dollar; ist es aufgebraucht, sind bis zur nächsten Aufladung keine Anfragen möglich.

registration:
  socialLogins: ["openid"]

# 1,000,000 credits = 1 USD. Start budget, top-ups and monthly resets are done by the
# portal gateway per user, so LibreChat's own refill stays off.
balance:
  enabled: true
  startBalance: 0
  autoRefillEnabled: false
  display: "currency"

endpoints:
  anthropic:
    # Chat titles with the cheapest model instead of the chat model
    titleConvo: true
    titleModel: "claude-haiku-5-5"
  agents:
    capabilities: ["execute_code", "skills", "artifacts", "tools", "context", "ocr"]
  # OpenRouter chat models: hidden for now. To enable, uncomment and add ",custom" to ENDPOINTS.
  # custom:
  #   - name: "OpenRouter"
  #     apiKey: "${OPENROUTER_KEY}"
  #     baseURL: "https://openrouter.ai/api/v1"
  #     models:
  #       default: ["openai/gpt-5"]
  #       # Also fetches OpenRouter's prices for balance accounting
  #       fetch: true
  #     titleConvo: true
  #     titleModel: "current_model"
  #     dropParams: ["stop"]
  #     modelDisplayLabel: "OpenRouter"

# Default: Claude Opus 5.5 with medium effort; users may switch model and effort.
# Each spec turns on the tools directly (code execution for file output, skills, artifacts,
# the portal MCP server for media/CAD), so no pre-created agents are needed.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "opus-5-5"
      label: "Claude Opus 5.5"
      description: "Standard – stärkstes Modell"
      default: true
      executeCode: true
      skills: true
      artifacts: true
      mcpServers: ["portal"]
      preset:
        endpoint: "anthropic"
        model: "claude-opus-5-5"
        effort: "medium"
    - name: "sonnet-5-5"
      label: "Claude Sonnet 5.5"
      description: "Schneller und günstiger"
      executeCode: true
      skills: true
      artifacts: true
      mcpServers: ["portal"]
      preset:
        endpoint: "anthropic"
        model: "claude-sonnet-5-5"
        effort: "medium"
    - name: "haiku-5-5"
      label: "Claude Haiku 5.5"
      description: "Sehr günstig für einfache Aufgaben"
      executeCode: true
      skills: true
      artifacts: true
      mcpServers: ["portal"]
      preset:
        endpoint: "anthropic"
        model: "claude-haiku-5-5"
        effort: "medium"

# Media tools (image, speech, video via OpenRouter, M7) and CAD tools (3D parts, M7b) served by the portal gateway
# Internal MCP servers are blocked by default (SSRF protection); allow only the gateway
mcpSettings:
  allowedAddresses:
    - "portal-gateway:8080"

mcpServers:
  portal:
    type: streamable-http
    url: http://portal-gateway:8080/portal/mcp
    # Image generation can take a while
    timeout: 180000
    headers:
      Authorization: "Bearer ${PORTAL_MCP_TOKEN}"
    # Sent with every tool call so the gateway knows whose budget to use
    requestHeaders:
      X-User-ID: "{{LIBRECHAT_USER_ID}}"
      X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"

fileConfig:
  endpoints:
    anthropic:
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 50
    agents:
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 50
  serverFileSizeLimit: 50
  avatarSizeLimit: 2
